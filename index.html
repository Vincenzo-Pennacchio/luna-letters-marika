  {name:"Carbonara",it:"Carbonara",emoji:"🍝",tip:"Mai usare la panna! La cremina si crea solo con uovo, pecorino e l'acqua di cottura aggiunta poco a poco fuori dal fuoco. È il segreto degli chef romani!",tipEn:"Never use cream! The creamy texture comes only from egg, pecorino and pasta water added slowly off the heat. It's the secret of Roman chefs!",words:[{en:"creamy",it:"cremoso",ex:"This pasta is so creamy and rich."},{en:"crispy",it:"croccante",ex:"The guanciale must be crispy."},{en:"yolk",it:"tuorlo",ex:"Use only the egg yolk for carbonara."},{en:"whisk",it:"sbattere / frusta",ex:"Whisk the yolks with the cheese."},{en:"toss",it:"mescolare velocemente",ex:"Toss the pasta in the sauce."}]},

  {name:"Cannoli",it:"Cannoli Siciliani",emoji:"🥐",tip:"I cannoli si riempiono SOLO al momento di servirli! Se li riempi prima, la cialda si ammolla e perde tutto il fascino. La ricotta deve essere setacciata fino a essere setosa.",tipEn:"Cannoli are filled ONLY just before serving! If you fill them earlier, the shell gets soggy and loses all its charm. The ricotta must be sifted until silky.",words:[{en:"shell",it:"guscio / cialda",ex:"The shell must stay crispy."},{en:"filling",it:"ripieno",ex:"The ricotta filling is divine."},{en:"sweet",it:"dolce",ex:"This dessert is wonderfully sweet."},{en:"crispy",it:"croccante",ex:"Bite into the crispy shell."},{en:"traditional",it:"tradizionale",ex:"It's a traditional Sicilian dessert."}]},

const FACTS=[
  {emoji:"✈️",title:"All'Aeroporto",titleEn:"At the Airport",fact:"Conoscere queste parole ti salva la vita in viaggio! 'Boarding' = imbarco. 'Gate' = uscita. 'Carry-on' = bagaglio a mano. 'Layover' = scalo. Negli annunci dicono sempre 'Final call for...' — ultima chiamata!",factEn:"Knowing these words is a lifesaver when traveling! 'Boarding' = imbarco. 'Gate' = uscita. 'Carry-on' = bagaglio a mano. 'Layover' = scalo.",words:[{en:"boarding",it:"imbarco",ex:"Boarding starts at 10:30."},{en:"gate",it:"uscita / gate",ex:"What's the gate number?"},{en:"carry-on",it:"bagaglio a mano",ex:"This is my carry-on bag."},{en:"layover",it:"scalo",ex:"I have a 3-hour layover in Rome."},{en:"departure",it:"partenza",ex:"My departure is at 6 AM."}]},
  {emoji:"🏨",title:"In Hotel",titleEn:"At the Hotel",fact:"In hotel sentirai sempre queste frasi! 'Check-in' e 'check-out' sono uguali in italiano. 'Room service' = servizio in camera. Se la stanza non ti piace puoi sempre chiedere 'May I have a different room?'",factEn:"At the hotel you'll always hear these! 'Room service' = servizio in camera. If you don't like the room you can ask 'May I have a different room?'",words:[{en:"reservation",it:"prenotazione",ex:"I have a reservation for tonight."},{en:"key card",it:"tessera della stanza",ex:"Here is your key card."},{en:"lobby",it:"hall / ingresso",ex:"Meet me in the lobby at 8."},{en:"amenities",it:"servizi",ex:"What amenities do you offer?"},{en:"upgrade",it:"miglioramento camera",ex:"You got a free upgrade!"}]},
  {emoji:"👗",title:"Moda & Vestiti",titleEn:"Fashion & Clothes",fact:"La moda parla inglese in tutto il mondo! 'Outfit' = completo. 'Trendy' = alla moda. 'Vintage' è uguale. Attenzione: 'fashion' significa moda, 'fashionable' significa alla moda. E 'gorgeous' = stupendo, è il complimento più chic!",factEn:"Fashion speaks English everywhere! 'Outfit' = completo. 'Trendy' = alla moda. 'Gorgeous' = stupendo, the most chic compliment!",words:[{en:"outfit",it:"completo",ex:"What a stunning outfit!"},{en:"trendy",it:"alla moda",ex:"This dress is so trendy this year."},{en:"gorgeous",it:"stupendo",ex:"You look absolutely gorgeous!"},{en:"elegant",it:"elegante",ex:"She has such an elegant style."},{en:"chic",it:"chic / elegante",ex:"That bag is so chic!"}]},

  {emoji:"🐾",title:"Animali Amici",titleEn:"Animal Friends",fact:"Gli animali in inglese hanno modi affettuosi per chiamarli! 'Puppy' = cucciolo di cane, 'kitten' = gattino. 'Pet' = animale domestico. E sai che un gruppo di gattini si chiama 'a kindle of kittens'? Adorabile!",factEn:"Animals have cute names in English! 'Puppy' = cucciolo di cane, 'kitten' = gattino. 'Pet' = animale domestico. A group of kittens is called 'a kindle of kittens'! Adorable!",words:[{en:"puppy",it:"cucciolo di cane",ex:"Look at that adorable puppy!"},{en:"kitten",it:"gattino",ex:"The kitten is so playful."},{en:"pet",it:"animale domestico",ex:"Do you have any pets?"},{en:"furry",it:"peloso",ex:"What a furry little friend!"},{en:"cuddle",it:"coccolare / abbracciare",ex:"I love to cuddle my dog."}]},

  {emoji:"🌹",title:"Bridgerton — Frasi e Vocaboli",titleEn:"Bridgerton — Words & Phrases",fact:"Bridgerton è ambientato nella Regency Era inglese (1811-1820) — un inglese elegante e formale! 'My dear' = mia cara. 'Indeed' = davvero. 'I beg your pardon' = mi scusi. E 'Lady' è sempre seguito dal cognome!",factEn:"Bridgerton is set in the Regency Era (1811-1820) — elegant formal English! 'My dear' = mia cara. 'Indeed' = davvero. 'I beg your pardon' = mi scusi. 'Lady' is always followed by the surname!",words:[{en:"my dear",it:"mia cara",ex:"My dear, you look stunning tonight."},{en:"indeed",it:"davvero / certamente",ex:"Indeed, that is true."},{en:"diamond of the season",it:"diamante della stagione",ex:"She is the diamond of the season."},{en:"courtship",it:"corteggiamento",ex:"Their courtship was very romantic."},{en:"scandalous",it:"scandaloso",ex:"That dress is positively scandalous!"}]},
  {emoji:"🇹🇷",title:"Serie Turche & DayDreamer",titleEn:"Turkish Series",fact:"Le serie turche con Can Yaman come 'DayDreamer' o 'Bay Yanlış' sono famose in tutto il mondo! In inglese le chiamano 'Turkish dramas' o 'Dizi'. Spesso parlano di amore intenso, famiglia e tradizioni — temi universali!",factEn:"Turkish series with Can Yaman like 'DayDreamer' or 'Mr. Wrong' are famous worldwide! In English they're called 'Turkish dramas' or 'Dizi'. They speak of intense love, family and tradition!",words:[{en:"drama",it:"dramma / serie drammatica",ex:"I love Turkish dramas."},{en:"romance",it:"storia d'amore",ex:"The romance is so intense!"},{en:"forbidden love",it:"amore proibito",ex:"It's a forbidden love story."},{en:"family bond",it:"legame familiare",ex:"Family bonds are sacred."},{en:"passionate",it:"appassionato",ex:"He gave her a passionate kiss."}]},
  {emoji:"🎤",title:"Musica Italiana nel Mondo",titleEn:"Italian Music Abroad",fact:"La musica italiana ha conquistato il mondo! 'Volare' di Modugno è una delle canzoni italiane più famose all'estero. Måneskin canta in italiano E in inglese. 'Ballad' = canzone lenta, 'tune' = melodia, 'lyrics' = testo!",factEn:"Italian music conquered the world! 'Volare' by Modugno is one of the most famous Italian songs abroad. Måneskin sings in Italian AND English. 'Ballad' = slow song, 'lyrics' = testo!",words:[{en:"lyrics",it:"testo (di canzone)",ex:"I love the lyrics of this song."},{en:"melody",it:"melodia",ex:"What a beautiful melody!"},{en:"chorus",it:"ritornello",ex:"The chorus is so catchy."},{en:"hit song",it:"successo / hit",ex:"This is the hit song of the summer."},{en:"singer",it:"cantante",ex:"She is my favorite singer."}]},
  {emoji:"🌍",title:"Viaggi & Culture",titleEn:"Travel & Cultures",fact:"'Wanderlust' è la parola perfetta per chi ama viaggiare — desiderio irresistibile di scoprire il mondo! Tipica del Sagittario! ♐ 'Bucket list' = lista di cose da fare nella vita. E 'hidden gem' = perla nascosta!",factEn:"'Wanderlust' is the perfect word for who loves traveling — irresistible desire to explore the world! Very Sagittarius! ♐ 'Bucket list' = list of things to do in life!",words:[{en:"wanderlust",it:"voglia di viaggiare",ex:"I have terrible wanderlust!"},{en:"bucket list",it:"lista dei sogni",ex:"Tokyo is on my bucket list."},{en:"hidden gem",it:"perla nascosta",ex:"This village is a hidden gem!"},{en:"adventure",it:"avventura",ex:"Every trip is an adventure."},{en:"abroad",it:"all'estero",ex:"I love traveling abroad."}]},
  {emoji:"🌙",title:"Il Vocabolario della Luna",titleEn:"The Language of the Moon",fact:"La luna ha un vocabolario tutto suo! 'Waxing' = la luna cresce, 'waning' = diminuisce. 'Crescent' è la luna a falce. E sai che 'lunatic' — pazzo — viene proprio da 'luna'? I romani credevano che la luna piena rendesse le persone pazze!",factEn:"The moon has its own vocabulary! 'Waxing' = growing, 'waning' = shrinking. 'Crescent' = crescent moon. 'Lunatic' comes from 'luna' — Romans believed the full moon made people crazy!",words:[{en:"waxing",it:"crescente",ex:"The waxing moon brings new energy."},{en:"waning",it:"calante",ex:"The waning moon is for releasing."},{en:"crescent",it:"falce / mezzaluna",ex:"The crescent moon is so romantic."},{en:"full moon",it:"luna piena",ex:"Tonight is a magical full moon!"},{en:"lunar",it:"lunare",ex:"The lunar cycle lasts 28 days."}]},
  {emoji:"⭐",title:"Stelle & Notti",titleEn:"Stars & Nights",fact:"Le stelle in inglese sono romantiche! 'Stargazing' = guardare le stelle. 'Shooting star' = stella cadente — esprimi un desiderio! 'Constellation' = costellazione. 'Twinkle' = brillare delle stelle, come nella canzone 'Twinkle twinkle little star'!",factEn:"Stars in English are romantic! 'Stargazing' = looking at stars. 'Shooting star' = stella cadente — make a wish! 'Constellation' = costellazione. 'Twinkle' = how stars sparkle!",words:[{en:"stargazing",it:"guardare le stelle",ex:"Let's go stargazing tonight!"},{en:"shooting star",it:"stella cadente",ex:"I saw a shooting star!"},{en:"constellation",it:"costellazione",ex:"That's the Sagittarius constellation."},{en:"twinkle",it:"brillare / scintillare",ex:"The stars twinkle so brightly."},{en:"wish",it:"desiderio / esprimere un desiderio",ex:"Make a wish on a star."}]},
  {emoji:"💙",title:"Il Tuo Colore: Blu",titleEn:"Your Color: Blue",fact:"Il blu ha tantissime sfumature in inglese! 'Navy' è il blu scuro, 'sky blue' è il celeste, 'cobalt' è intenso, 'teal' è azzurro-verde, 'royal blue' è regale. Il mare al tramonto le ha tutte!",factEn:"Blue has so many shades in English! 'Navy' = dark blue, 'sky blue' = celeste, 'cobalt' = intense blue, 'teal' = blue-green, 'royal blue' = regal!",words:[{en:"navy",it:"blu marino",ex:"She wore a beautiful navy dress."},{en:"cobalt",it:"blu cobalto",ex:"Cobalt is a rich deep blue."},{en:"teal",it:"azzurro-verde",ex:"The sea was a perfect teal color."},{en:"sky blue",it:"azzurro cielo",ex:"What a perfect sky blue day."},{en:"royal blue",it:"blu reale",ex:"Royal blue suits you perfectly."}]},
  {emoji:"☕",title:"Caffè & Colazione",titleEn:"Coffee & Breakfast",fact:"L'italiano ha conquistato il mondo del caffè! 'Espresso', 'cappuccino', 'latte' sono parole italiane usate ovunque. Ma in America ordinare un 'latte' significa solo latte caldo! Devi sempre dire 'coffee latte' o 'caffè latte'.",factEn:"Italian conquered the coffee world! But in America ordering a 'latte' means just warm milk! You always have to say 'coffee latte'.",words:[{en:"sip",it:"sorso / sorseggiare",ex:"I love to sip my morning coffee."},{en:"brew",it:"preparare",ex:"I brew fresh coffee every morning."},{en:"cozy",it:"accogliente",ex:"This café feels so cozy!"},{en:"aroma",it:"aroma / profumo",ex:"The aroma of coffee is amazing."},{en:"refill",it:"ricarica",ex:"Can I have a refill, please?"}]},
  {emoji:"🍕",title:"Cibo Italiano nel Mondo",titleEn:"Italian Food Abroad",fact:"Tantissime parole italiane del cibo si usano in inglese senza traduzione: 'al dente', 'bruschetta', 'tiramisu', 'risotto'. Ma 'pepperoni' in America NON è il peperone! È un salame piccante. Errore classicissimo!",factEn:"Many Italian food words are used in English. But 'pepperoni' in America is NOT peperone! It's a spicy salami. A classic Italian mistake abroad!",words:[{en:"savory",it:"saporito / salato",ex:"This is an incredibly savory dish."},{en:"homemade",it:"fatto in casa",ex:"Homemade pasta is always the best."},{en:"aromatic",it:"aromatico",ex:"The tomato sauce is very aromatic."},{en:"indulge",it:"concedersi",ex:"Let's indulge in some good pasta!"},{en:"authentic",it:"autentico",ex:"This is authentic Italian food."}]},
  {emoji:"❤️",title:"Romance & Appuntamenti",titleEn:"Romance & Dating",fact:"Il vocabolario dell'amore è bellissimo in inglese! 'Date' = appuntamento. 'Crush' = cotta. 'Soulmate' = anima gemella. 'Sweet nothings' = dolci paroline sussurrate. E 'I'm head over heels for you' significa 'sono pazza/o di te'!",factEn:"Love vocabulary is beautiful in English! 'Date' = appuntamento. 'Crush' = cotta. 'Soulmate' = anima gemella. 'Head over heels' = pazzamente innamorato!",words:[{en:"date",it:"appuntamento",ex:"We're going on a date tonight."},{en:"crush",it:"cotta",ex:"I have a huge crush on him."},{en:"soulmate",it:"anima gemella",ex:"I think he's my soulmate."},{en:"adore",it:"adorare",ex:"I absolutely adore you."},{en:"butterflies",it:"farfalle nello stomaco",ex:"He gives me butterflies."}]},
  {emoji:"🚨",title:"False Friends!",titleEn:"False Friends — Attenzione!",fact:"Le 'false friends' sono parole inglesi che SEMBRANO italiane ma significano cose completamente diverse! 'Actually' NON vuol dire 'attualmente' — significa 'in realtà'! 'Library' NON è 'libreria' — è 'biblioteca'!",factEn:"'False friends' are English words that LOOK Italian but mean completely different things! 'Actually' does NOT mean 'attualmente' — it means 'in realtà'!",words:[{en:"actually",it:"⚠️ IN REALTÀ (≠ attualmente!)",ex:"Actually, I love Italian food!"},{en:"eventually",it:"⚠️ ALLA FINE (≠ eventualmente!)",ex:"Eventually she learned English."},{en:"library",it:"⚠️ BIBLIOTECA (≠ libreria!)",ex:"I found this at the library."},{en:"sensible",it:"⚠️ RAGIONEVOLE (≠ sensibile!)",ex:"That was a very sensible choice."},{en:"sympathetic",it:"⚠️ COMPRENSIVO (≠ simpatico!)",ex:"She was very sympathetic."}]},
  {emoji:"💬",title:"Frasi Pratiche",titleEn:"Everyday English Phrases",fact:"Queste sono le frasi che si usano DAVVERO nella vita quotidiana in inglese! Al ristorante, in viaggio, con persone nuove. Imparare frasi complete vale più di 50 parole isolate — sono pronte da usare subito!",factEn:"These are phrases ACTUALLY used in daily English life! At restaurants, traveling, with new people. Learning complete phrases is worth more than 50 isolated words!",words:[{en:"Can I have the bill, please?",it:"Posso avere il conto, per favore?",ex:"Waiter! Can I have the bill, please?"},{en:"Could you repeat that, please?",it:"Puoi ripetere, per favore?",ex:"Sorry, could you repeat that slowly?"},{en:"How much does it cost?",it:"Quanto costa?",ex:"Excuse me, how much does this cost?"},{en:"I don't understand, sorry.",it:"Non capisco, mi dispiace.",ex:"I don't understand. Can you help me?"},{en:"Nice to meet you!",it:"Piacere di conoscerti!",ex:"Hi, I'm Marika! Nice to meet you!"}]},
  {emoji:"📅",title:"Numeri & Giorni",titleEn:"Numbers & Days",fact:"I giorni della settimana in inglese vengono da divinità nordiche e romane! Monday = Luna (Moon-day), Thursday = Thor (dio del tuono), Friday = Freya (dea dell'amore), Saturday = Saturno. E December viene da 'decem' — dieci in latino!",factEn:"English days come from Nordic and Roman deities! Monday = Moon-day, Thursday = Thor, Friday = Freya (goddess of love). December comes from 'decem' — ten in Latin!",words:[{en:"Monday",it:"Lunedì",ex:"I have plans on Monday."},{en:"weekend",it:"fine settimana",ex:"I love weekends!"},{en:"December",it:"Dicembre",ex:"My birthday is in December! ♐"},{en:"first / second",it:"primo / secondo",ex:"She lives on the third floor."},{en:"twice / always",it:"due volte / sempre",ex:"I travel twice a year."}]},

function shuffle(a){return[...a].sort(()=>Math.random()-0.5);}
function getLevel(xp){return LEVELS.find(l=>xp<l.max)||LEVELS[LEVELS.length-1];}
function getLevelProgress(xp){
  const i=LEVELS.findIndex(l=>xp<l.max);
  if(i<0) return{pct:100,current:LEVELS[LEVELS.length-1]};
  const prev=i>0?LEVELS[i-1].max:0;
  return{pct:Math.round((xp-prev)/(LEVELS[i].max-prev)*100),current:LEVELS[i],next:LEVELS[i+1]};
}

// Regex unicode costruite a runtime (Babel non le tocca) con fallback per browser vecchi
let EMOJI_RE=null,WORD_RE=/^([^A-Za-zÀ-ÿ]*)(.*?)([^A-Za-zÀ-ÿ]*)$/;
try{EMOJI_RE=new RegExp("[\\p{Extended_Pictographic}\\u{1F1E6}-\\u{1F1FF}\\uFE0F\\u200D]","gu");}catch{}
try{WORD_RE=new RegExp("^([^\\p{L}]*)(.*?)([^\\p{L}]*)$","u");}catch{}
function ttsClean(t){return EMOJI_RE?t.replace(EMOJI_RE,''):t;}

function speak(text,rate=0.82){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(ttsClean(text));
  u.lang='en-US';u.rate=rate;window.speechSynthesis.speak(u);
}
function speakAll(texts,rate=0.82){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  texts.forEach(t=>{const u=new SpeechSynthesisUtterance(ttsClean(t));u.lang='en-US';u.rate=rate;window.speechSynthesis.speak(u);});
}
function stopSpeaking(){try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch{}}

function playSound(ok){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(ok){
      o.type='sine';o.frequency.value=523;
      g.gain.setValueAtTime(0.18,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
      o.start();o.stop(ctx.currentTime+0.5);
    }else{
      o.type='square';o.frequency.value=160;
      g.gain.setValueAtTime(0.1,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.22);
      o.start();o.stop(ctx.currentTime+0.22);
    }
  }catch{}
}

  gtxt:{fontSize:26,fontWeight:800,background:"linear-gradient(90deg,#90caf9,#42a5f5,#ffd54f)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"},

// ── 🧠 MEMORY ─────────────────────────────────────────────────────────────────
function dealMemory(){
  const picked=[],seen=new Set();
  for(const w of shuffle(WORD_POOL)){
    if(picked.length>=6) break;
    if(seen.has(w.it)||w.en.length>16||w.it.length>22) continue;
    seen.add(w.it);picked.push(w);
  }
  return shuffle(picked.flatMap((w,i)=>[{pair:i,lang:"en",text:w.en},{pair:i,lang:"it",text:w.it}]));
}

function MemoryGame({kit,onExit,onFinish}){
  const[cards,setCards]=useState(dealMemory);
  const[open,setOpen]=useState([]);
  const[matched,setMatched]=useState([]);
  const[moves,setMoves]=useState(0);
  const[miss,setMiss]=useState(false);
  const[xp,setXp]=useState(null);
  const pairs=cards.length/2;

  function restart(){setCards(dealMemory());setOpen([]);setMatched([]);setMoves(0);setMiss(false);setXp(null);}
  function tap(i){
    const c=cards[i];
    if(open.length>=2||open.includes(i)||matched.includes(c.pair)) return;
    if(c.lang==="en") speak(c.text);
    const now=[...open,i];
    setOpen(now);
    if(now.length<2) return;
    const m=moves+1;setMoves(m);
    const[a,b]=now.map(k=>cards[k]);
    if(a.pair===b.pair){
      playSound(true);
      const nm=[...matched,a.pair];
      setTimeout(()=>{
        setMatched(nm);setOpen([]);
        if(nm.length===pairs){
          const gain=20+(m<=10?10:0);
          kit.addXP(gain);setXp(gain);onFinish(m);
          if(m<=10) kit.unlockAch("memory_pro");
        }
      },500);
    }else{
      playSound(false);setMiss(true);
      setTimeout(()=>{setOpen([]);setMiss(false);},1100);
    }
  }

  if(xp!==null) return(
    <GameOver emoji={moves<=10?"🐘":"🌟"} title={`Completato in ${moves} mosse!`}
      msg={moves<=10?"Memoria d'elefante! Bonus +10 XP":"Prova a farcela in 10 mosse o meno!"}
      xp={xp} onReplay={restart} onExit={onExit}/>
  );
  return(
    <>
      <GameTop icon="🧠" title="Memory delle Parole" onExit={onExit} right={`${moves} mosse · ${matched.length}/${pairs}`}/>
      <div style={{...S.center,...S.muted,marginBottom:14}}>Trova le coppie inglese 🇬🇧 ↔ italiano 🇮🇹</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
        {cards.map((c,i)=>{
          const isM=matched.includes(c.pair),isO=open.includes(i),up=isM||isO;
          let bg="linear-gradient(135deg,#0d47a1,#1976d2)",bd="rgba(144,202,249,0.35)";
          if(up) bg=c.lang==="en"?"linear-gradient(135deg,#1565c066,#42a5f533)":"linear-gradient(135deg,#4a148c66,#7b1fa233)";
          if(isM){bg="linear-gradient(135deg,#1b5e2088,#4caf5044)";bd="#4caf50";}
          else if(isO&&miss) bd="#f44336";
          return(
            <button key={i} onClick={()=>tap(i)}
              style={{minHeight:88,borderRadius:16,border:`2px solid ${bd}`,background:bg,color:"#fff",padding:"8px 6px",fontSize:13,fontWeight:700,lineHeight:1.3,cursor:up?"default":"pointer",animation:isO?"pop 0.25s ease":"none",wordBreak:"break-word"}}>
              {up?(<><div style={{fontSize:10,opacity:0.7,marginBottom:3}}>{c.lang==="en"?"🇬🇧":"🇮🇹"}</div>{c.text}</>):<span style={{fontSize:26}}>🌙</span>}
            </button>
          );
        })}
      </div>
    </>
  );
}

// ── 🔤 LETTERE MESCOLATE ──────────────────────────────────────────────────────
function scrambleTiles(en){
  const l=en.toLowerCase().split("");
  let sh=shuffle(l),t=0;
  while(sh.join("")===l.join("")&&t++<20) sh=shuffle(l);
  return sh.map((ch,id)=>({id,ch}));
}

function ScrambleGame({kit,onExit,onFinish}){
  const pick=()=>shuffle(WORD_POOL.filter(w=>/^[a-z]{4,9}$/i.test(w.en))).slice(0,SCRAMBLE_ROUNDS);
  const[words,setWords]=useState(pick);
  const[step,setStep]=useState(0);
  const[tiles,setTiles]=useState(()=>scrambleTiles(words[0].en));
  const[ans,setAns]=useState([]);
  const[status,setStatus]=useState(null); // ok | bad | skip
  const[hinted,setHinted]=useState(false);
  const[score,setScore]=useState(0);
  const[xp,setXp]=useState(0);
  const[done,setDone]=useState(false);
  const w=words[step],target=w.en.toLowerCase();
  const busy=status!==null;

  function load(ws,i){setTiles(scrambleTiles(ws[i].en));setAns([]);setStatus(null);setHinted(false);}
  function restart(){const ws=pick();setWords(ws);setStep(0);setScore(0);setXp(0);setDone(false);load(ws,0);}
  function next(sc){
    if(step+1>=words.length){setDone(true);onFinish(sc);return;}
    setStep(step+1);load(words,step+1);
  }
  function place(na,usedHint){
    setAns(na);
    if(na.length<target.length) return;
    if(na.map(id=>tiles[id].ch).join("")===target){
      const gain=(hinted||usedHint)?5:10;
      setStatus("ok");playSound(true);speak(w.en);
      kit.addXP(gain);setXp(x=>x+gain);setScore(score+1);
      setTimeout(()=>next(score+1),1500);
    }else{
      setStatus("bad");playSound(false);
      setTimeout(()=>{setAns([]);setStatus(null);},800);
    }
  }
  function tapTile(id){if(busy||ans.includes(id)) return;place([...ans,id],false);}
  function undo(){if(!busy) setAns(a=>a.slice(0,-1));}
  function hint(){
    if(busy) return;
    let p=0;
    while(p<ans.length&&tiles[ans[p]].ch===target[p]) p++;
    const keep=ans.slice(0,p);
    const t=tiles.find(t=>t.ch===target[p]&&!keep.includes(t.id));
    if(!t) return;
    setHinted(true);
    place([...keep,t.id],true);
  }
  function skip(){if(busy) return;setStatus("skip");speak(w.en);setTimeout(()=>next(score),1800);}

  if(done) return(
    <GameOver emoji={score>=6?"🏆":score>=4?"🌟":"💪"} title={`${score}/${words.length} parole!`}
      msg={cheer(score,words.length)} xp={xp} onReplay={restart} onExit={onExit}/>
  );
  const slotCol=status==="ok"?"#4caf50":status==="bad"?"#f44336":status==="skip"?"#ffd54f":"rgba(144,202,249,0.4)";
  return(
    <>
      <GameTop icon="🔤" title="Lettere Mescolate" onExit={onExit} right={`${step+1}/${words.length} · ${score} ✅`}/>
      <div style={S.bar}><div style={S.fill(step/words.length*100)}/></div>
      <div style={S.card({...S.center,margin:"14px 0"})}>
        <div style={S.muted}>Indizio 🇮🇹</div>
        <div style={{fontSize:20,fontWeight:800,color:"#a5d6a7",marginTop:4}}>{w.topic} {w.it}</div>
        <div style={{...S.muted,fontSize:12,marginTop:4}}>{target.length} lettere</div>
      </div>
      <div style={{display:"flex",justifyContent:"center",gap:5,flexWrap:"wrap",marginBottom:20,animation:status==="bad"?"shake 0.4s":"none"}}>
        {target.split("").map((ch,i)=>{
          const letter=status==="skip"?ch:(ans[i]!==undefined?tiles[ans[i]].ch:"");
          return <div key={i} style={{width:36,height:46,borderRadius:10,border:`2px solid ${slotCol}`,background:letter?"rgba(255,255,255,0.1)":"rgba(255,255,255,0.03)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,fontWeight:800,textTransform:"uppercase"}}>{letter}</div>;
        })}
      </div>
      <div style={{display:"flex",justifyContent:"center",gap:8,flexWrap:"wrap",marginBottom:18}}>
        {tiles.map(t=>{
          const used=ans.includes(t.id);
          return(
            <button key={t.id} onClick={()=>tapTile(t.id)} disabled={used}
              style={{width:44,height:48,borderRadius:12,border:"none",background:used?"rgba(255,255,255,0.05)":"linear-gradient(135deg,#6a1b9a,#ab47bc)",color:used?"transparent":"#fff",fontSize:22,fontWeight:800,textTransform:"uppercase",cursor:used?"default":"pointer",boxShadow:used?"none":"0 3px 0 #4a148c"}}>
              {t.ch}
            </button>
          );
        })}
      </div>
      {status==="ok"&&<div style={{...S.center,color:"#a5d6a7",fontWeight:800,fontSize:18,marginBottom:12}}>✅ {w.en} · +{hinted?5:10} XP</div>}
      {status==="skip"&&<div style={{...S.center,color:"#ffd54f",fontWeight:700,marginBottom:12}}>La parola era: {w.en}</div>}
      <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
        <button style={S.soft()} onClick={undo}>⌫ Cancella</button>
        <button style={S.soft()} onClick={hint}>💡 Aiuto</button>
        <button style={S.soft()} onClick={skip}>⏭ Salta</button>
      </div>
      <div style={{...S.center,...S.muted,fontSize:11,marginTop:14}}>Senza aiuto +10 XP · con aiuto +5 XP</div>
    </>
  );
}

// ── 🧩 COSTRUISCI LA FRASE ────────────────────────────────────────────────────
function builderChips(en){
  const toks=en.split(/\s+/),idx=toks.map((_,i)=>i);
  let order=shuffle(idx),t=0;
  while(order.every((v,i)=>v===i)&&t++<20) order=shuffle(idx);
  return order.map(i=>({id:i,t:toks[i]}));
}

function BuilderGame({kit,onExit,onFinish}){
  const pick=()=>shuffle(SENTENCE_POOL).slice(0,BUILDER_ROUNDS);
  const[items,setItems]=useState(pick);
  const[step,setStep]=useState(0);
  const[chips,setChips]=useState(()=>builderChips(items[0].en));
  const[placed,setPlaced]=useState([]);
  const[tries,setTries]=useState(0);
  const[status,setStatus]=useState(null); // ok | bad | shown
  const[score,setScore]=useState(0);
  const[perfect,setPerfect]=useState(0);
  const[xp,setXp]=useState(0);
  const[done,setDone]=useState(false);
  const it=items[step];
  const locked=status==="ok"||status==="shown";
  const word=id=>chips.find(c=>c.id===id).t;

  function load(list,i){setChips(builderChips(list[i].en));setPlaced([]);setTries(0);setStatus(null);}
  function restart(){const l=pick();setItems(l);setStep(0);setScore(0);setPerfect(0);setXp(0);setDone(false);load(l,0);}
  function add(id){if(locked||placed.includes(id)) return;setPlaced([...placed,id]);if(status==="bad")setStatus(null);}
  function remove(id){if(locked) return;setPlaced(placed.filter(x=>x!==id));if(status==="bad")setStatus(null);}
  function check(){
    if(locked||placed.length<chips.length) return;
    if(placed.map(word).join(" ")===it.en){
      const first=tries===0,gain=first?15:5;
      setStatus("ok");playSound(true);speak(it.en);
      kit.addXP(gain);setXp(x=>x+gain);setScore(s=>s+1);
      if(first) setPerfect(p=>p+1);
    }else{
      setTries(t=>t+1);setStatus("bad");playSound(false);
    }
  }
  function next(){
    if(step+1>=items.length){
      setDone(true);onFinish(score);
      if(perfect===items.length) kit.unlockAch("sentence_perfect");
      return;
    }
    setStep(step+1);load(items,step+1);
  }

  if(done) return(
    <GameOver emoji={perfect===items.length?"🧩":score>=4?"🌟":"💪"} title={`${score}/${items.length} frasi!`}
      msg={perfect===items.length?"Tutte al primo colpo! Sei un'architetta di frasi!":cheer(score,items.length)}
      xp={xp} onReplay={restart} onExit={onExit}/>
  );
  const pool=chips.filter(c=>!placed.includes(c.id));
  const lineCol=status==="ok"?"#4caf50":status==="bad"?"#f44336":status==="shown"?"#ffd54f":"rgba(144,202,249,0.4)";
  return(
    <>
      <GameTop icon="🧩" title="Costruisci la Frase" onExit={onExit} right={`${step+1}/${items.length} · ${score} ✅`}/>
      <div style={S.bar}><div style={S.fill(step/items.length*100)}/></div>
      <div style={S.card({...S.center,margin:"14px 0"})}>
        <div style={S.muted}>Traduci in inglese {it.src}</div>
        <div style={{fontSize:16,fontWeight:700,color:"#a5d6a7",marginTop:6,lineHeight:1.5}}>"{it.it}"</div>
      </div>
      <div style={{minHeight:72,borderRadius:16,border:`2px dashed ${lineCol}`,background:"rgba(255,255,255,0.04)",padding:10,display:"flex",flexWrap:"wrap",gap:8,alignItems:"center",justifyContent:"center",marginBottom:16,animation:status==="bad"?"shake 0.4s":"none"}}>
        {status==="shown"
          ?<div style={{color:"#ffd54f",fontWeight:700,fontSize:16,textAlign:"center",lineHeight:1.5}}>{it.en}</div>
          :placed.length===0
            ?<div style={{...S.muted,fontSize:12}}>Tocca le parole qui sotto, in ordine 👇</div>
            :placed.map(id=><button key={id} onClick={()=>remove(id)} style={chipStyle(true)}>{word(id)}</button>)}
      </div>
      {!locked&&<div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center",marginBottom:18,minHeight:44}}>
        {pool.map(c=><button key={c.id} onClick={()=>add(c.id)} style={chipStyle(false)}>{c.t}</button>)}
      </div>}
      {status==="bad"&&<div style={{...S.center,color:"#ef9a9a",fontSize:13,marginBottom:12}}>Non ancora! Tocca una parola in alto per toglierla e riprova 💪</div>}
      {status==="ok"&&<div style={{...S.center,color:"#a5d6a7",fontWeight:800,marginBottom:12}}>✅ Perfetto! +{tries===0?15:5} XP <button onClick={()=>speak(it.en)} style={{...S.spk,margin:"0 0 0 8px"}}>🔊</button></div>}
      {status==="shown"&&<div style={{...S.center,marginBottom:12}}><button onClick={()=>speak(it.en)} style={S.spk}>🔊 Ascolta la frase</button></div>}
      <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
        {!locked&&<button style={{...S.btn(),opacity:placed.length===chips.length?1:0.4}} onClick={check}>✔️ Controlla</button>}
        {!locked&&tries>=2&&<button style={S.soft()} onClick={()=>{setStatus("shown");speak(it.en);}}>👀 Soluzione</button>}
        {locked&&<button style={S.btn("linear-gradient(135deg,#2e7d32,#66bb6a)")} onClick={next}>{step+1>=items.length?"🏁 Fine":"Avanti →"}</button>}
      </div>
      <div style={{...S.center,...S.muted,fontSize:11,marginTop:14}}>Al primo colpo +15 XP · dopo un errore +5 XP</div>
    </>
  );
}

// ── 🎧 ASCOLTA E SCRIVI ───────────────────────────────────────────────────────
const normAns=s=>s.toLowerCase().replace(/’/g,"'").replace(/[^a-z' ]/g," ").replace(/\s+/g," ").trim();

function DictationGame({kit,onExit,onFinish}){
  const canSpeak=!!window.speechSynthesis;
  const pick=()=>shuffle(WORD_POOL.filter(w=>/^[a-z][a-z' -]{2,14}$/i.test(w.en))).slice(0,DICT_ROUNDS);
  const[words,setWords]=useState(pick);
  const[started,setStarted]=useState(false);
  const[step,setStep]=useState(0);
  const[input,setInput]=useState("");
  const[tries,setTries]=useState(0);
  const[status,setStatus]=useState(null); // ok | bad | reveal
  const[score,setScore]=useState(0);
  const[xp,setXp]=useState(0);
  const[done,setDone]=useState(false);
  const ref=useRef(null);
  const w=words[step];
  const locked=status==="ok"||status==="reveal";

  function say(word,slow){if(canSpeak) speak(word.en,slow?0.5:0.8);}
  function focus(){setTimeout(()=>{try{ref.current&&ref.current.focus();}catch{}},120);}
  function start(){setStarted(true);say(w);focus();}
  function restart(){const ws=pick();setWords(ws);setStep(0);setInput("");setTries(0);setStatus(null);setScore(0);setXp(0);setDone(false);setStarted(true);say(ws[0]);focus();}
  function check(){
    if(locked||!input.trim()) return;
    if(normAns(input)===normAns(w.en)){
      const gain=tries===0?10:5;
      setStatus("ok");playSound(true);kit.addXP(gain);setXp(x=>x+gain);setScore(s=>s+1);
    }else{
      const t=tries+1;setTries(t);playSound(false);
      if(t>=2){setStatus("reveal");say(w);}else setStatus("bad");
    }
  }
  function next(){
    if(step+1>=words.length){setDone(true);onFinish(score);return;}
    const n=step+1;setStep(n);setInput("");setTries(0);setStatus(null);
    say(words[n]);focus();
  }

  if(done) return(
    <GameOver emoji={score>=6?"🏆":score>=4?"🌟":"💪"} title={`${score}/${words.length} parole!`}
      msg={cheer(score,words.length)} xp={xp} onReplay={restart} onExit={onExit}/>
  );
  if(!started) return(
    <>
      <GameTop icon="🎧" title="Ascolta e Scrivi" onExit={onExit}/>
      <div style={S.card({...S.center,padding:28})}>
        <div style={{fontSize:48,marginBottom:10}}>🔊</div>
        <div style={{fontWeight:700,fontSize:16,marginBottom:8}}>Alza il volume!</div>
        <div style={{...S.muted,lineHeight:1.7,marginBottom:20}}>Sentirai {words.length} parole in inglese. Scrivile correttamente — è il modo migliore per allenare orecchio e ortografia!</div>
        {!canSpeak&&<div style={{color:"#ffcc80",fontSize:13,marginBottom:16}}>⚠️ Questo browser non supporta la voce: vedrai la parola in italiano da tradurre.</div>}
        <button style={S.btn()} onClick={start}>Inizia! 🎧</button>
      </div>
    </>
  );
  const pattern=w.en.split("").map(ch=>ch===" "?"  ":/[a-z]/i.test(ch)?"_":ch).join(" ");
  const letters=w.en.replace(/[^a-z]/gi,"").length;
  const col=status==="ok"?"#4caf50":status==="bad"?"#f44336":status==="reveal"?"#ffd54f":"rgba(144,202,249,0.4)";
  return(
    <>
      <GameTop icon="🎧" title="Ascolta e Scrivi" onExit={onExit} right={`${step+1}/${words.length} · ${score} ✅`}/>

        <div style={{fontFamily:"monospace",fontSize:20,letterSpacing:1,color:"#90caf9",marginBottom:6,wordBreak:"break-word"}}>{pattern}</div>
        <div style={{...S.muted,fontSize:12}}>{letters} lettere</div>
      </div>
      <form onSubmit={e=>{e.preventDefault();locked?next():check();}}>

          onChange={e=>{setInput(e.target.value);if(status==="bad")setStatus(null);}}
          autoCapitalize="off" autoCorrect="off" autoComplete="off" spellCheck={false}
          placeholder="Scrivi qui in inglese..."
          style={{width:"100%",background:"rgba(255,255,255,0.08)",border:`2px solid ${col}`,borderRadius:16,padding:"14px 16px",color:"#fff",fontSize:18,outline:"none",textAlign:"center",fontFamily:"inherit",animation:status==="bad"?"shake 0.4s":"none"}}/>
        {status==="ok"&&<div style={{...S.center,color:"#a5d6a7",fontWeight:800,margin:"12px 0"}}>✅ Esatto! {w.en} = {w.it} · +{tries===0?10:5} XP</div>}
        {status==="bad"&&<div style={{...S.center,color:"#ef9a9a",fontSize:13,margin:"12px 0 4px"}}>❌ Non proprio! Riprova</div>}
        {tries>=1&&!locked&&<div style={{...S.center,color:"#ffd54f",fontSize:13,margin:"6px 0 12px"}}>💡 Inizia con «{w.en[0].toLowerCase()}» · 🇮🇹 {w.it}</div>}
        {status==="reveal"&&<div style={{...S.center,color:"#ffd54f",fontWeight:700,margin:"12px 0"}}>La parola era: {w.en} ({w.it})</div>}
        <div style={{display:"flex",gap:10,justifyContent:"center",marginTop:14}}>
          {locked
            ?<button type="submit" style={S.btn("linear-gradient(135deg,#2e7d32,#66bb6a)")}>{step+1>=words.length?"🏁 Fine":"Avanti →"}</button>
            :<button type="submit" style={{...S.btn(),opacity:input.trim()?1:0.4}}>✔️ Controlla</button>}
        </div>
      </form>
    </>
  );
}

// ── ⚡ VERO O FALSO LAMPO ─────────────────────────────────────────────────────
function speedCard(prevEn){
  const rnd=()=>WORD_POOL[Math.floor(Math.random()*WORD_POOL.length)];
  let w=rnd();
  while(w.en===prevEn) w=rnd();
  const truth=Math.random()<0.5;
  let it=w.it;
  if(!truth){let o=rnd();while(o.it===w.it) o=rnd();it=o.it;}
  return{en:w.en,it,truth,real:w.it};
}

function SpeedGame({kit,onExit,onFinish,best}){
  const[phase,setPhase]=useState("ready"); // ready | play | over
  const[time,setTime]=useState(SPEED_TIME);
  const[card,setCard]=useState(()=>speedCard());
  const[score,setScore]=useState(0);
  const[wrong,setWrong]=useState(0);
  const[combo,setCombo]=useState(0);
  const[flash,setFlash]=useState(null);
  const[record,setRecord]=useState(best||0);
  const[mistakes,setMistakes]=useState([]);
  const scoreRef=useRef(0);

  useEffect(()=>{
    if(phase!=="play") return;
    const t=setInterval(()=>setTime(s=>s-1),1000);
    return()=>clearInterval(t);
  },[phase]);
  useEffect(()=>{
    if(phase!=="play"||time>0) return;
    setPhase("over");
    const sc=scoreRef.current;
    if(sc>0) kit.addXP(sc*2);
    onFinish(sc);
    if(sc>=20) kit.unlockAch("speed_20");
  },[time,phase]);

  function start(){
    setRecord(best||0);scoreRef.current=0;setScore(0);setWrong(0);setCombo(0);setMistakes([]);
    setTime(SPEED_TIME);setCard(speedCard());setPhase("play");
  }
  function answer(v){
    if(phase!=="play") return;
    const ok=v===card.truth;
    if(ok){scoreRef.current++;setScore(scoreRef.current);setCombo(c=>c+1);}
    else{setWrong(x=>x+1);setCombo(0);setMistakes(m=>m.some(x=>x.en===card.en)?m:[...m,card]);}
    playSound(ok);setFlash(ok?"ok":"bad");setTimeout(()=>setFlash(null),220);
    setCard(speedCard(card.en));
  }

  if(phase==="over") return(
    <GameOver emoji={score>record?"🏆":score>=15?"⚡":"💪"} title={`${score} risposte giuste!`}
      msg={score>record?"🎉 Nuovo record personale!":`Il tuo record: ${record} · errori: ${wrong}`}
      xp={score*2} onReplay={start} onExit={onExit}>
      {mistakes.length>0&&<div style={S.card({textAlign:"left",marginTop:4})}>
        <div style={{fontSize:13,fontWeight:800,color:"#ffd54f",marginBottom:8}}>📚 Ripassa queste parole</div>
        {mistakes.slice(0,8).map((m,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 0"}}>
            <button onClick={()=>speak(m.en)} style={{...S.spk,margin:0,padding:"3px 9px"}}>🔊</button>
            <div style={{fontSize:14}}><b>{m.en}</b> <span style={{color:"#a5d6a7"}}>= {m.real}</span></div>
          </div>
        ))}
      </div>}
    </GameOver>
  );
  if(phase==="ready") return(
    <>
      <GameTop icon="⚡" title="Vero o Falso Lampo" onExit={onExit}/>
      <div style={S.card({...S.center,padding:28})}>
        <div style={{fontSize:48,marginBottom:10}}>⏱️</div>
        <div style={{fontWeight:700,fontSize:16,marginBottom:8}}>{SPEED_TIME} secondi, quante ne indovini?</div>
        <div style={{...S.muted,lineHeight:1.7,marginBottom:16}}>Vedrai una parola inglese e una traduzione. Premi <b style={{color:"#a5d6a7"}}>✅ Vero</b> se è giusta, <b style={{color:"#ef9a9a"}}>❌ Falso</b> se è sbagliata. Più veloce sei, più punti fai!</div>
        {record>0&&<div style={{color:"#ffd54f",fontSize:14,marginBottom:16}}>🏅 Il tuo record: {record}</div>}
        <button style={S.btn("linear-gradient(135deg,#e65100,#ff6f00)",{fontSize:17,padding:"14px 32px"})} onClick={start}>Via! ⚡</button>
      </div>
    </>
  );
  const bd=flash==="ok"?"#4caf50":flash==="bad"?"#f44336":"rgba(255,255,255,0.15)";
  return(
    <>
      <GameTop icon="⚡" title="Vero o Falso Lampo" onExit={onExit} right={`⏱ ${time}s · ${score} ✅`}/>
      <div style={S.bar}><div style={{height:"100%",width:`${time/SPEED_TIME*100}%`,background:time<=10?"linear-gradient(90deg,#e53935,#ff7043)":"linear-gradient(90deg,#ff6f00,#ffd54f)",borderRadius:10,transition:"width 1s linear"}}/></div>
      <div style={{...S.center,height:22,margin:"8px 0",color:"#ffb74d",fontWeight:800}}>{combo>=3?`🔥 Combo x${combo}`:""}</div>
      <div style={S.card({...S.center,padding:"30px 16px",border:`2px solid ${bd}`,transition:"border-color 0.15s",minHeight:170,display:"flex",flexDirection:"column",justifyContent:"center"})}>
        <div style={{fontSize:28,fontWeight:800}}>{card.en}</div>
        <div style={{...S.muted,fontSize:18,margin:"6px 0"}}>=</div>
        <div style={{fontSize:20,fontWeight:700,color:"#90caf9"}}>{card.it}</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <button onClick={()=>answer(false)} style={{height:72,borderRadius:18,border:"2px solid #f44336",background:"rgba(244,67,54,0.2)",color:"#fff",fontSize:20,fontWeight:800,cursor:"pointer"}}>❌ Falso</button>
        <button onClick={()=>answer(true)} style={{height:72,borderRadius:18,border:"2px solid #4caf50",background:"rgba(76,175,80,0.2)",color:"#fff",fontSize:20,fontWeight:800,cursor:"pointer"}}>✅ Vero</button>
      </div>
    </>
  );
}

const GAME_VIEWS={memory:MemoryGame,scramble:ScrambleGame,builder:BuilderGame,dictation:DictationGame,speed:SpeedGame};

function Badge({col,children}){
  return <span style={{background:col?`${col}33`:"rgba(255,255,255,0.08)",border:`1px solid ${col?col+"88":"rgba(255,255,255,0.15)"}`,color:col?"#fff":"#b3c5d7",borderRadius:10,padding:"3px 10px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{children}</span>;
}
function readingMinutes(r){return Math.max(1,Math.round(r.paras.reduce((s,p)=>s+p.en.split(/\s+/).length,0)/80));}

function ReadingView({r,kit,best,onBack,onFinish,onNext}){
  const[showIt,setShowIt]=useState([]);
  const[allIt,setAllIt]=useState(false);
  const[slow,setSlow]=useState(false);
  const[sheet,setSheet]=useState(null);
  const[answers,setAnswers]=useState({});
  const[result,setResult]=useState(null);
  const[qs]=useState(()=>r.quiz.map(q=>({...q,order:shuffle(q.opts.map((_,i)=>i))})));
  const rate=slow?0.6:0.82;
  const light=r.format==="postcard";
  useEffect(()=>stopSpeaking,[]);

  const itOn=i=>allIt||showIt.includes(i);
  const toggleIt=i=>setShowIt(s=>s.includes(i)?s.filter(x=>x!==i):[...s,i]);
  const say=p=>p.name?`${p.name}. ${p.en}`:p.en;

  // Ogni parola è toccabile: se è nel glossario apre la traduzione, altrimenti la pronuncia.
  function words(text){
    return text.split(/(\s+)/).map((tok,i)=>{
      if(!tok.trim()) return tok;
      const m=tok.match(WORD_RE);
      const pre=m?m[1]:"",core=m?m[2]:tok,post=m?m[3]:"";
      if(!core) return <React.Fragment key={i}>{tok}</React.Fragment>;
      const k=core.toLowerCase(),key=r.gloss[k]?k:k.replace(/'s$/,"");
      const g=r.gloss[key];
      return(
        <React.Fragment key={i}>{pre}<span
          onClick={e=>{e.stopPropagation();speak(core,rate);if(g) setSheet({en:key,it:g});}}
          style={g?{borderBottom:`2px dotted ${light?"#b8860b":"#ffd54f"}`,cursor:"pointer"}:{cursor:"pointer"}}>{core}</span>{post}</React.Fragment>
      );
    });
  }

  const tb=on=>({background:on?(light?"rgba(46,125,50,0.15)":"rgba(165,214,167,0.2)"):(light?"rgba(0,0,0,0.05)":"rgba(255,255,255,0.07)"),border:`1px solid ${light?"rgba(0,0,0,0.15)":"rgba(255,255,255,0.15)"}`,borderRadius:10,padding:"3px 10px",fontSize:12,cursor:"pointer",color:light?"#3e2723":"#fff"});
  const tools=(i,text)=>(
    <div style={{display:"flex",gap:6,marginTop:6}}>
      <button onClick={()=>speak(text,rate)} style={tb(false)}>🔊</button>
      <button onClick={()=>toggleIt(i)} style={tb(itOn(i))}>🇮🇹</button>
    </div>
  );
  const itText=(p,i)=>itOn(i)&&<div style={{fontSize:13,fontStyle:"italic",color:light?"#2e7d32":"#a5d6a7",marginTop:6,lineHeight:1.6}}>{p.it}</div>;
  const headIt=p=>allIt&&<div style={{fontSize:12,color:light?"#2e7d32":"#a5d6a7",fontStyle:"italic",fontWeight:400,letterSpacing:0,textTransform:"none"}}>{p.it}</div>;

  function choose(qi,oi){
    if(answers[qi]!==undefined) return;
    playSound(oi===qs[qi].a);
    const na={...answers,[qi]:oi};
    setAnswers(na);
    if(Object.keys(na).length===qs.length){
      const score=qs.filter((q,i)=>na[i]===q.a).length;
      setResult({score,gain:onFinish(score,qs.length)});
    }
  }

  let body;
  if(r.format==="chat"){
    body=(
      <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:16}}>
        {r.paras.map((p,i)=>{
          const me=p.who==="Marika";
          return(

              <div style={{maxWidth:"86%",background:me?"linear-gradient(135deg,#1565c0,#1e88e5)":"rgba(255,255,255,0.09)",border:me?"1px solid transparent":"1px solid rgba(255,255,255,0.14)",borderRadius:me?"18px 4px 18px 18px":"4px 18px 18px 18px",padding:"10px 14px"}}>
                <div style={{fontSize:11,fontWeight:700,color:me?"#bbdefb":"#ce93d8",marginBottom:4}}>{p.who}</div>
                <div style={{fontSize:15,lineHeight:1.6}}>{words(p.en)}</div>
                {itText(p,i)}{tools(i,p.en)}
              </div>
            </div>
          );

      </div>
    );
  }else if(r.format==="menu"){
    body=(
      <div style={S.card({background:"linear-gradient(180deg,#1a1a2e,#16213e)",borderColor:"#ffd54f44",fontFamily:"Georgia,serif",padding:"24px 18px"})}>
        <div style={{textAlign:"center",marginBottom:6}}>
          <div style={{color:"#ffd54f",fontSize:24}}>🌙 {r.head.name}</div>

        {r.paras.map((p,i)=>p.h
          ?<div key={i} style={{textAlign:"center",color:"#ffd54f",fontSize:14,letterSpacing:3,textTransform:"uppercase",margin:"22px 0 12px"}}>— {words(p.en)} —{headIt(p)}</div>
          :<div key={i} style={{marginBottom:16}}>

              <div style={{flex:1,fontSize:15,lineHeight:1.6}}>{p.name&&<b style={{color:"#fff8e1"}}>{words(p.name)} · </b>}{words(p.en)}</div>
              {p.price&&<div style={{color:"#ffd54f",fontWeight:700,flexShrink:0}}>{p.price}</div>}
            </div>

      </div>
    );
  }else if(r.format==="email"){
    body=(
      <div style={S.card({padding:0,overflow:"hidden"})}>

        </div>

          {r.paras.map((p,i)=>(

          <div key={i} style={{marginBottom:14}}>

  const answered=Object.keys(answers).length;
  return(
    <>
      <button style={{...S.back,marginTop:16}} onClick={()=>{stopSpeaking();onBack();}}>← Letture</button>
      <div style={S.center}>
        <div style={{fontSize:48,marginBottom:4}}>{r.emoji}</div>
        <div style={{...S.gtxt,fontSize:24}}>{r.titleEn}</div>
        <div style={{color:"#90caf9",fontStyle:"italic",fontSize:14,marginTop:2}}>{r.title}</div>
        <div style={{display:"flex",gap:6,justifyContent:"center",marginTop:10,flexWrap:"wrap"}}>

            <div key={qi} style={{marginBottom:16}}>
              <div style={{fontWeight:700,fontSize:15,lineHeight:1.5}}>{qi+1}. {q.q}</div>

                  if(done){
                    if(oi===q.a){bg="rgba(76,175,80,0.25)";bd="#4caf50";mark="✅ ";}

              </div>
            </div>

        {result&&<div style={{...S.center,padding:"16px 8px 4px",borderTop:"1px solid rgba(255,255,255,0.12)",animation:"fadeIn 0.4s ease"}}>
          <div style={{fontSize:44}}>{result.score===qs.length?"🏆":result.score>=qs.length/2?"🌟":"💪"}</div>

          <div style={{color:"#ffd54f",fontSize:15,margin:"6px 0 14px"}}>{result.gain>0?`+${result.gain} XP guadagnati!`:"Nessun XP extra: hai già fatto questo punteggio 😉"}</div>
          <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
            <button style={S.soft()} onClick={()=>{setAnswers({});setResult(null);}}>🔄 Riprova</button>

              ?<div style={{color:"#a5d6a7",fontSize:13,padding:10}}>✅ Già imparata</div>
              :<button style={S.btn()} onClick={()=>{kit.learnWord(sheet.en);setSheet(null);}}>⭐ La so! +5 XP</button>}
            <button style={S.soft()} onClick={()=>setSheet(null)}>Chiudi</button>
          </div>
        </div>
      </div>}
    </>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){

  useEffect(()=>{try{localStorage.setItem('llm_xp',xp);}catch{}},[xp]);
  useEffect(()=>{try{localStorage.setItem('llm_learned',JSON.stringify([...learned]));}catch{}},[learned]);

  useEffect(()=>{try{localStorage.setItem('llm_dialogues',JSON.stringify([...completedDialogues]));}catch{}},[completedDialogues]);
  useEffect(()=>{try{localStorage.setItem('llm_games',JSON.stringify([...gamesPlayed]));}catch{}},[gamesPlayed]);

  useEffect(()=>{try{localStorage.setItem('llm_readings',JSON.stringify(readDone));}catch{}},[readDone]);

  // ── UI state ─────────────────────────────────────────────────

  // ── Zodiac ───────────────────────────────────────────────────

  const[factWordI,setFactWordI]=useState(0);

  const[factFlipping,setFactFlipping]=useState(false);

  // Welcome-back notification
  useEffect(()=>{

    const now=Date.now();
    try{localStorage.setItem('llm_lastVisit',now);}catch{}

      const msg=NOTIF_MSGS[Math.floor(Math.random()*NOTIF_MSGS.length)];

      catch{try{new Notification('Luna & Letters 🌙',{body:msg});}catch{}}

  },[]);

  // Badge in coda: se se ne sbloccano due insieme, si vedono uno dopo l'altro
  useEffect(()=>{
    if(newAch||!achQueue.length) return;

    return()=>clearTimeout(t);
  },[newAch,achQueue]);

  function unlockAch(id){
    setAchievements(prev=>{
      if(prev.has(id)) return prev;
      const a=ACHIEVEMENTS.find(x=>x.id===id);
      if(!a) return prev;
      setAchQueue(q=>[...q,a]);
      return new Set([...prev,id]);
    });
  }

  function addXP(n){
    setXp(prev=>{
      const next=prev+n;
      if(prev<100&&next>=100) setTimeout(()=>unlockAch('full_moon'),300);
      if(prev<LEVELS[LEVELS.length-2].max&&next>=LEVELS[LEVELS.length-2].max) setTimeout(()=>unlockAch('master'),300);
      return next;
    });
  }

  function markStudied(){
    const today=todayStr(),yest=new Date(Date.now()-86400000).toDateString();
    if(lastStudy===today) return;
    const ns=lastStudy===yest?streak+1:1;
    setStreak(ns);setLastStudy(today);
    try{localStorage.setItem('llm_streak',ns);localStorage.setItem('llm_lastStudy',today);}catch{}
    if(ns===3) setTimeout(()=>unlockAch('streak_3'),300);
    if(ns===7) setTimeout(()=>unlockAch('streak_7'),300);
  }

  function learnWord(w){
    if(learned.has(w)) return;
    const ns=new Set([...learned,w]);
    setLearned(ns);addXP(5);markStudied();
    const c=ns.size;
    setTimeout(()=>{
      if(c===1) unlockAch('first_word');
      if(c===10) unlockAch('ten_words');
      if(c===50) unlockAch('fifty_words');
      if(c===100) unlockAch('hundred_words');
    },200);
    const ffWords=['actually','eventually','library','sensible','sympathetic'];
    if(ffWords.includes(w)&&ffWords.every(fw=>ns.has(fw))) setTimeout(()=>unlockAch('false_friend'),300);
  }

  function completeDialogue(id){
    if(completedDialogues.has(id)) return;
    const ns=new Set([...completedDialogues,id]);
    setCompletedDialogues(ns);addXP(15);markStudied();
    setTimeout(()=>{
      if(ns.size===1) unlockAch('first_dialogue');
      if(ns.size===DIALOGUES.length) unlockAch('all_dialogues');
    },200);
  }

  // I giochi danno XP da soli; qui si salvano record e partite giocate.
  function finishGame(id,score){
    const g=GAMES.find(x=>x.id===id);
    setGameBest(prev=>{
      const old=prev[id];
      const better=old===undefined||(g&&g.lower?score<old:score>old);
      return better?{...prev,[id]:score}:prev;
    });
    markStudied();
    if(!gamesPlayed.has(id)){
      const ns=new Set([...gamesPlayed,id]);
      setGamesPlayed(ns);
      setTimeout(()=>{
        if(ns.size===1) unlockAch('first_game');
        if(ns.size===GAMES.length) unlockAch('all_games');
      },300);
    }
  }

  // Lettura: +20 XP la prima volta, +5 XP per ogni risposta giusta oltre il record.
  function finishReading(id,score,total){
    const prev=readDone[id],first=prev===undefined;
    const gain=(first?20:0)+5*Math.max(0,score-(first?0:prev));
    if(gain) addXP(gain);
    markStudied();
    const nd={...readDone,[id]:first?score:Math.max(prev,score)};
    setReadDone(nd);
    setTimeout(()=>{
      unlockAch('first_reading');
      if(score===total) unlockAch('perfect_reading');
      if(READINGS.every(r=>nd[r.id]!==undefined)) unlockAch('all_readings');
    },300);
    return gain;
  }

  /* ──────────────────────────────────────────────────────────────────
   * 🤖 AI CHAT — COMMENTATA (era per Emanuela, qui non serve)
   * Lasciata qui in caso di riattivazione futura.
   * Per riattivare: scommentare questo blocco + il blocco JSX dello screen "chat"
   * + la card "chat" nell'array delle sezioni home.
   * ──────────────────────────────────────────────────────────────────
  const[chatMessages,setChatMessages]=useState([]);
  const[chatInput,setChatInput]=useState('');
  const[chatLoading,setChatLoading]=useState(false);
  const[ttsEnabled,setTtsEnabled]=useState(false);
  const[listening,setListening]=useState(false);
  const chatBottomRef=useRef(null);
  useEffect(()=>{chatBottomRef.current?.scrollIntoView({behavior:'smooth'});},[chatMessages,chatLoading]);

  async function handleSend(text){
    const msg=(text!==undefined?text:chatInput).trim();
    if(!msg||chatLoading) return;
    setChatInput('');
    const userMsg={role:'user',content:msg};
    const history=[...chatMessages,userMsg];
    setChatMessages(history);
    setChatLoading(true);
    try{
      const res=await fetch('/.netlify/functions/chat',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:history}),
      });
      const data=await res.json();
      const reply=data.text||data.error||'Ops, qualcosa non ha funzionato. Riprova! 🌙';
      setChatMessages(m=>[...m,{role:'assistant',content:reply}]);
      if(ttsEnabled){
        const clean=reply.replace(/[\u{1F1E6}-\u{1F1FF}]/gu,'').replace(/[✨🌙🌸🔮💎⭐💡]/gu,'').replace(/\n/g,' ');
        speak(clean);
      }
    }catch{
      setChatMessages(m=>[...m,{role:'assistant',content:'Ops, non riesco a rispondere ora. Controlla la connessione! 🌙'}]);
    }finally{setChatLoading(false);}
  }

  function startListening(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('Il microfono non è supportato su questo browser.\nProva a usare Chrome!');return;}
    const r=new SR();
    r.lang='it-IT';r.interimResults=false;
    setListening(true);
    r.onresult=e=>{setChatInput(e.results[0][0].transcript);setListening(false);};
    r.onerror=()=>setListening(false);
    r.onend=()=>setListening(false);
    r.start();
  }
  * ────────────────────────────────────────────────────────────────── */

  function doFlip(setFlip,setFlipAnim,cb){
    if(setFlip===setFlipped&&flipped) return;
    if(setFlip===setFactFlipped&&factFlipped) return;
    setFlipAnim(true);
    setTimeout(()=>{cb();setFlipAnim(false);},160);
  }

  function startQuiz(count,rev,daily){
    const all=[];
    RECIPES.forEach(c=>c.words.forEach(w=>all.push(w)));
    FACTS.forEach(f=>f.words.forEach(w=>all.push(w)));
    const sel=shuffle(all).slice(0,count);
    const qs=sel.map(q=>{
      const wrong=shuffle(all.filter(w=>rev?w.en!==q.en:w.it!==q.it)).slice(0,3);
      return{...q,options:shuffle([q,...wrong])};
    });
    setQuiz(qs);setQStep(0);setQScore(0);setQAns(null);setQDone(false);setQRev(rev);setQDaily(daily);
    setTvQuizMode(null);
    setScreen('quiz');
  }

  function startTVQuiz(mode){
    const all=[];
    TV.forEach(s=>s.phrases.forEach(p=>all.push({...p,show:s.show,showEmoji:s.emoji})));
    const sel=shuffle(all).slice(0,10);
    const qs=sel.map(q=>{
      if(mode==='show'){
        const wrongShows=shuffle(TV.map(s=>({show:s.show,showEmoji:s.emoji})).filter(s=>s.show!==q.show)).slice(0,3);
        return{...q,options:shuffle([{show:q.show,showEmoji:q.showEmoji},...wrongShows])};
      } else {
        const wrong=shuffle(all.filter(p=>p.it!==q.it)).slice(0,3);
        return{...q,options:shuffle([q,...wrong])};
      }
    });
    setQuiz(qs);setQStep(0);setQScore(0);setQAns(null);setQDone(false);setQRev(false);setQDaily(false);

  // ── Computed ─────────────────────────────────────────────────

  const readN=READINGS.filter(r=>readDone[r.id]!==undefined).length;
  const kit={addXP,markStudied,learnWord,unlockAch,learned};

  // ── WELCOME ───────────────────────────────────────────────────
  if(!welcomed){

            {slides.map((_,i)=><div key={i} style={{width:8,height:8,borderRadius:"50%",background:i===welcomeStep?"#1976d2":"rgba(255,255,255,0.2)",transition:"all 0.3s"}}/>)}

        </div>

  const overlays=(
    <>
      {showFlash&&<div style={{position:"fixed",inset:0,background:"linear-gradient(135deg,rgba(255,215,0,0.35),rgba(25,118,210,0.25))",pointerEvents:"none",zIndex:9997,animation:"screenFlash 0.9s ease forwards"}}/>}

          {score===total?"Perfetta! Sei straordinaria, Marika! 🌕":score>=total*0.8?"Ottimo lavoro! Quasi perfetta!":score>=total*0.5?"Bene! Continua così!":"Riprova — ci stai arrivando!"}
        </div>
        {qDaily&&<div style={{background:"linear-gradient(135deg,#bf360c44,#ff6f0022)",border:"1px solid #ff6f0055",borderRadius:16,padding:"12px 20px",marginBottom:12,fontSize:14,color:"#ff6f00",fontWeight:700}}>🔥 Sfida del Giorno completata! +{score*20} XP guadagnati!</div>}
        {!qDaily&&<div style={{fontSize:22,color:"#ffd54f",marginBottom:24}}>+{score*(qRev?20:10)} XP guadagnati!</div>}
        <div style={{display:"flex",flexDirection:"column",gap:12,alignItems:"center",marginTop:16}}>
          <button style={S.btn()} onClick={()=>tvQuizMode?startTVQuiz(tvQuizMode):startQuiz(quiz.length,qRev,false)}>🔄 Rigioca</button>
          <button style={S.soft()} onClick={()=>{if(tvQuizMode){setTvQuizMode(null);setScreen("tvQuizPick");}else setScreen("quizPick");}}>Cambia modalità</button>
          <button style={S.soft()} onClick={()=>{setTvQuizMode(null);setScreen("home");}}>← Torna alla Home</button>
        </div>
      </div></div>{overlays}</>
    );
  }

  // ── QUIZ ──────────────────────────────────────────────────────
  if(screen==="quiz"&&quiz){
    const q=quiz[qStep];
    const question=tvQuizMode?q.en:(qRev?q.it:q.en);
    const speakQ=q.en;
    const qLabel=tvQuizMode==='show'?"Di quale serie è questa frase?":tvQuizMode==='translate'?"Cosa vuol dire in italiano?":qRev?"Come si dice in inglese?":"Come si dice in italiano?";
    return(
      <div style={S.app}><div style={S.wrap}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"20px 0 12px"}}>
          <button style={S.back} onClick={()=>tvQuizMode?setScreen("tvQuizPick"):setScreen("quizPick")}>← Modalità</button>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {qDaily&&<span style={{background:"rgba(255,111,0,0.2)",border:"1px solid #ff6f00",borderRadius:10,padding:"3px 8px",fontSize:11,color:"#ff6f00"}}>🔥 Sfida</span>}
            {qRev&&<span style={{background:"rgba(25,118,210,0.2)",border:"1px solid #1976d2",borderRadius:10,padding:"3px 8px",fontSize:11,color:"#90caf9"}}>⚡ Inverso</span>}
            {tvQuizMode&&<span style={{background:"rgba(186,104,200,0.2)",border:"1px solid #ba68c8",borderRadius:10,padding:"3px 8px",fontSize:11,color:"#ce93d8"}}>🎬 TV</span>}
            <div style={{color:"#ffd54f",fontWeight:700}}>{qStep+1}/{quiz.length} · {qScore} ✅</div>
          </div>
        </div>
        <div style={S.bar}><div style={S.fill((qStep/quiz.length)*100)}/></div>
        <div style={{...S.center,padding:"24px 0 8px"}}>
          <div style={S.muted}>{qLabel}</div>
          <div style={{fontSize:tvQuizMode?17:28,fontWeight:800,marginTop:8,marginBottom:4,lineHeight:1.4,fontStyle:tvQuizMode?"italic":"normal"}}>
            {tvQuizMode?`"${question}"`:question}
          </div>
          {tvQuizMode!=='show'&&<button onClick={()=>speak(speakQ)} style={S.spk}>🔊 Ascolta</button>}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginTop:8}}>
          {q.options.map((opt,i)=>{
            let val,isCorrect,isSel;
            if(tvQuizMode==='show'){
              val=`${opt.showEmoji} ${opt.show}`;
              isCorrect=opt.show===q.show;
              isSel=qAns&&qAns.show===opt.show;
            } else if(tvQuizMode==='translate'){
              val=opt.it;
              isCorrect=opt.it===q.it;
              isSel=qAns&&qAns.it===opt.it;
            } else {
              val=qRev?opt.en:opt.it;
              isCorrect=val===(qRev?q.en:q.it);
              isSel=qAns&&(qRev?qAns.en:qAns.it)===val;
            }
            let bg="rgba(255,255,255,0.06)",bd="rgba(255,255,255,0.12)";
            if(qAns){if(isCorrect){bg="rgba(76,175,80,0.3)";bd="#4caf50";}else if(isSel){bg="rgba(244,67,54,0.3)";bd="#f44336";}}
            return(<button key={i} onClick={()=>handleAns(opt)}
              style={{background:bg,border:`2px solid ${bd}`,borderRadius:16,padding:"16px 8px",color:"#fff",fontSize:tvQuizMode==='show'?13:13,fontWeight:600,cursor:qAns?"default":"pointer",textAlign:"center",transition:"all 0.2s",lineHeight:1.4}}>
              {val}
            </button>);
          })}
        </div>
      </div>{overlays}</div>
    );
  }

  // ── PROVERBI ─────────────────────────────────────────────────
  if(screen==="proverbi"){
    const p=PROVERBS[provI],w=p.words[provWordI];
    return(
      <div style={S.app}><div style={S.wrap}>
        <button style={S.back} onClick={()=>{setScreen("home");setProvI(0);setProvWordI(0);setProvWordFlipped(false);}}>← Home</button>
        <div style={S.center}>
          <div style={{fontSize:44,marginBottom:4}}>🤌</div>
          <div style={S.gtxt}>Detti Napoletani</div>
          <div style={{...S.muted,marginTop:2}}>Proverbio {provI+1} di {PROVERBS.length}</div>
        </div>

        <div style={S.card({background:"linear-gradient(135deg,#bf360c88,#e6510066)",borderColor:"#ff6f0055",margin:"14px 0"})}>
          <div style={{...S.muted,fontSize:11,marginBottom:8}}>🇬🇧 In inglese</div>
          <div style={{fontSize:17,fontWeight:800,lineHeight:1.6,marginBottom:10,color:"#fff"}}>"{p.en}"</div>
          <button onClick={()=>speak(p.en)} style={S.spk}>🔊 Ascolta</button>
          <div style={{borderTop:"1px solid rgba(255,255,255,0.15)",marginTop:14,paddingTop:12}}>
            <div style={{...S.muted,fontSize:11,marginBottom:4}}>🗺️ In napoletano</div>
            <div style={{fontSize:14,color:"#ffd54f",fontStyle:"italic",lineHeight:1.7}}>"{p.nap}"</div>
          </div>
          <div style={{borderTop:"1px solid rgba(255,255,255,0.15)",marginTop:12,paddingTop:12}}>
            <div style={{...S.muted,fontSize:11,marginBottom:4}}>🇮🇹 In italiano</div>
            <div style={{fontSize:14,color:"#b0bec5",lineHeight:1.7}}>"{p.it}"</div>
          </div>
        </div>

        <div style={S.card({background:"rgba(255,255,255,0.04)",marginBottom:12})}>
          <div style={{...S.muted,fontSize:11,marginBottom:6}}>💡 Cosa significa</div>
          <div style={{fontSize:13,color:"#e3f2fd",lineHeight:1.8}}>{p.meaning}</div>
          <div style={{fontSize:12,color:"#7986cb",marginTop:8,fontStyle:"italic",lineHeight:1.6}}>🇬🇧 {p.meaningEn}</div>
        </div>

        <div style={{...S.center,...S.muted,marginBottom:8,fontSize:12}}>📚 Parole dal proverbio · {provWordI+1}/{p.words.length}</div>
        <div
          onClick={()=>{if(!provWordFlipped&&!provWordFlipping){setProvWordFlipping(true);setTimeout(()=>{setProvWordFlipped(true);learnWord(w.en);setProvWordFlipping(false);},160);}}}
          style={S.card({background:provWordFlipped?"linear-gradient(135deg,#1b5e2088,#4caf5044)":"linear-gradient(135deg,#bf360c44,#e6510033)",...S.center,padding:24,minHeight:120,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:provWordFlipped?"default":"pointer",transform:provWordFlipping?"scaleX(0.05)":"scaleX(1)",transition:"transform 0.16s ease"})}>
          <div style={{fontSize:22,fontWeight:800,marginBottom:4}}>{w.en}</div>
          {!provWordFlipped
            ?(<><button onClick={e=>{e.stopPropagation();speak(w.en);}} style={S.spk}>🔊 Ascolta</button><div style={{color:"#ffccbc",fontSize:13,marginTop:4}}>Tocca per scoprire! 👆</div></>)
            :(<><button onClick={e=>{e.stopPropagation();speak(w.en);}} style={S.spk}>🔊 Ascolta ancora</button><div style={{fontSize:18,fontWeight:800,color:"#a5d6a7",margin:"4px 0"}}>{w.it}</div><div style={{fontSize:12,color:"#b0bec5",fontStyle:"italic",marginTop:4}}>"{w.ex}"</div><div style={{marginTop:8,fontSize:16}}>✅ +5 XP!</div></>)}
        </div>

        <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:16}}>
          {provWordI>0&&<button style={S.soft()} onClick={()=>{setProvWordI(i=>i-1);setProvWordFlipped(false);}}>← Prec</button>}
          {provWordI<p.words.length-1
            ?<button style={S.btn()} onClick={()=>{setProvWordI(i=>i+1);setProvWordFlipped(false);}}>Parola successiva →</button>
            :<div style={{...S.muted,fontSize:12,...S.center}}>✅ Hai imparato tutte le parole!</div>}
        </div>

        <div style={{display:"flex",gap:10,justifyContent:"center"}}>
          {provI>0&&<button style={S.soft()} onClick={()=>{setProvI(i=>i-1);setProvWordI(0);setProvWordFlipped(false);}}>← Proverbio prec.</button>}
          {provI<PROVERBS.length-1
            ?<button style={S.btn("linear-gradient(135deg,#e65100,#ff6f00)")} onClick={()=>{setProvI(i=>i+1);setProvWordI(0);setProvWordFlipped(false);}}>Prossimo proverbio →</button>
            :<button style={S.btn("linear-gradient(135deg,#2e7d32,#66bb6a)")} onClick={()=>{setScreen("home");setProvI(0);setProvWordI(0);setProvWordFlipped(false);}}>🌟 Completato!</button>}
        </div>
      </div>{overlays}</div>
    );
  }

  /* ════════════════════════════════════════════════════════════════
     🤖 CHAT SCREEN — DISATTIVATA per la versione di Marika
     ────────────────────────────────────────────────────────────────
     Il blocco JSX della chat AI è commentato qui sotto. Non l'ho
     cancellato — se in futuro vuoi riattivare la chat (es: per
     fartela usare anche tu, Vincenzo), basta:
     1. Rimuovere questo commento e quello di chiusura in fondo
     2. Decommentare anche il blocco di stato + funzioni più in alto
        (cerca: "BLOCCO CHAT AI COMMENTATO")
     3. Decommentare la card della chat in Home
     4. Aggiornare il greeting iniziale (era pensato per Emanuela)

  if(screen==="chat") return(
    <div style={{...S.app,display:"flex",flexDirection:"column",height:"100vh",maxHeight:"100vh"}}>
      <div style={{background:"linear-gradient(135deg,#0d2b6b,#1976d2)",padding:"14px 16px",borderBottom:"1px solid rgba(255,255,255,0.1)",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
        <button style={{...S.back,marginBottom:0}} onClick={()=>setScreen("home")}>← Home</button>
        <div style={{flex:1,display:"flex",alignItems:"center",gap:10}}>
          <img src="Luna_AI_assistant.png" style={{width:40,height:40,borderRadius:"50%",objectFit:"cover",flexShrink:0,border:"2px solid rgba(66,165,245,0.6)"}} alt="Luna"/>
          <div>
            <div style={{fontWeight:700,fontSize:15}}>Luna, la tua tutor</div>
            <div style={{...S.muted,fontSize:11}}>AI · scrivi in italiano o in inglese!</div>
          </div>
        </div>
        <button onClick={()=>setTtsEnabled(t=>!t)} style={{background:ttsEnabled?"rgba(0,150,136,0.3)":"rgba(255,255,255,0.08)",border:`1px solid ${ttsEnabled?"#00bcd4":"rgba(255,255,255,0.15)"}`,borderRadius:20,padding:"6px 12px",color:"#fff",fontSize:12,cursor:"pointer",whiteSpace:"nowrap"}}>
          {ttsEnabled?"🔊 Voce ON":"🔇 Voce OFF"}
        </button>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"16px",display:"flex",flexDirection:"column",gap:12}}>
        {chatMessages.length===0&&(
          <div style={{animation:"fadeIn 0.4s ease"}}>
            <div style={{background:"rgba(13,71,161,0.25)",border:"1px solid rgba(66,165,245,0.3)",borderRadius:"4px 20px 20px 20px",padding:"14px 16px",maxWidth:"88%",marginBottom:16}}>
              <div style={{fontSize:13,lineHeight:1.9,color:"#e3f2fd"}}>
                🌙 Ciao Marika! Sono <strong>Luna</strong>, la tua tutor di inglese!<br/><br/>
                Scrivimi <strong>in italiano</strong> e ti aiuto a dirlo in inglese, oppure prova <strong>direttamente in inglese</strong> — correggo io con gentilezza. Puoi anche usare il 🎤 microfono!
              </div>
            </div>
            <div style={{...S.muted,fontSize:12,marginBottom:10}}>💡 Da dove vuoi iniziare?</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {[
                "Come si dice 'carbonara' in inglese?",
                "Aiutami con un dialogo all'aeroporto ✈️",
                "Parliamo di Bridgerton 🌹",
                "Aiutami col mio segno ♐",
                "Spiegami una parola che non capisco",
                "Voglio fare conversazione!",
              ].map((s,i)=>(
                <button key={i} onClick={()=>handleSend(s)}
                  style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:20,padding:"8px 14px",color:"#b0bec5",fontSize:12,cursor:"pointer"}}>
                  {s}
                </button>
              ))}
            </div>
          </div>
        )}

        {chatMessages.map((m,i)=>(
          <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start",alignItems:"flex-end",gap:8}}>
            {m.role==="assistant"&&<img src="Luna_AI_assistant.png" style={{width:28,height:28,borderRadius:"50%",objectFit:"cover",flexShrink:0}} alt="Luna"/>}
            <div style={{
              background:m.role==="user"?"linear-gradient(135deg,#1976d2,#42a5f5)":"rgba(255,255,255,0.07)",
              border:m.role==="user"?"none":"1px solid rgba(255,255,255,0.12)",
              borderRadius:m.role==="user"?"20px 4px 20px 20px":"4px 20px 20px 20px",
              padding:"12px 16px",maxWidth:"88%",
              fontSize:13,lineHeight:1.85,color:"#fff",whiteSpace:"pre-wrap",wordBreak:"break-word",
            }}>{m.content}</div>
          </div>
        ))}

        {chatLoading&&(
          <div style={{display:"flex",justifyContent:"flex-start"}}>
            <div style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:"4px 20px 20px 20px",padding:"12px 16px",color:"#b0bec5",fontSize:13}}>
              Luna sta scrivendo ✨
            </div>
          </div>
        )}
        <div ref={chatBottomRef}/>
      </div>

      <div style={{background:"rgba(10,14,39,0.97)",borderTop:"1px solid rgba(255,255,255,0.1)",padding:"12px 16px",display:"flex",gap:10,alignItems:"flex-end",flexShrink:0}}>
        <textarea
          value={chatInput}
          onChange={e=>setChatInput(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();handleSend();}}}
          placeholder="Scrivi in italiano o in inglese..."
          rows={1}
          style={{flex:1,background:"rgba(255,255,255,0.08)",border:"1px solid rgba(255,255,255,0.15)",borderRadius:16,padding:"10px 14px",color:"#fff",fontSize:14,resize:"none",outline:"none",fontFamily:"system-ui,sans-serif",lineHeight:1.5,maxHeight:100,overflowY:"auto"}}
        />
        <button onClick={startListening}
          style={{background:listening?"rgba(244,67,54,0.3)":"rgba(255,255,255,0.08)",border:`1px solid ${listening?"#f44336":"rgba(255,255,255,0.15)"}`,borderRadius:14,padding:"10px 12px",color:listening?"#ef9a9a":"#b0bec5",fontSize:18,cursor:"pointer",flexShrink:0}}>
          🎤
        </button>
        <button onClick={()=>handleSend()} disabled={!chatInput.trim()||chatLoading}
          style={{background:"linear-gradient(135deg,#1565c0,#42a5f5)",border:"none",borderRadius:14,padding:"10px 18px",color:"#fff",fontSize:16,fontWeight:700,cursor:"pointer",flexShrink:0,opacity:chatInput.trim()&&!chatLoading?1:0.4}}>
          ➤
        </button>
      </div>
    </div>
  );

     ────────────────────────────────────────────────────────────────
     FINE blocco chat commentato
     ════════════════════════════════════════════════════════════════ */

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
